<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cowork | Focused Work, Shared Energy</title>
  <style>
    :root {
      --bg: #0a0d12;
      --text: #ffffff;
      --muted: #d5d7da;
      --cyan: #52c0b9;
      --purple: #6946c0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center start;
      overflow: hidden;
      padding: 120px 24px 72px;
      background:
        radial-gradient(circle at 82% 18%, rgba(82, 192, 185, 0.22), transparent 28rem),
        radial-gradient(circle at 12% 20%, rgba(105, 70, 192, 0.24), transparent 26rem),
        var(--bg);
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.74;
      z-index: 0;
    }

    .hero-overlay,
    .hero-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-overlay {
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(10, 13, 18, 0.88) 0%, rgba(10, 13, 18, 0.48) 48%, rgba(10, 13, 18, 0.72) 100%),
        rgba(0, 0, 0, 0.18);
    }

    .hero-gradient {
      z-index: 2;
      background: linear-gradient(180deg, rgba(10, 13, 18, 0.1) 0%, rgba(10, 13, 18, 0.68) 72%, #000 100%);
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: min(100%, 1040px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--cyan);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 860px;
      margin: 0;
      font-size: clamp(3.2rem, 9vw, 8rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.075em;
    }

    p {
      max-width: 690px;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 300;
      line-height: 1.55;
    }

    .accent {
      color: var(--cyan);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 44px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 12px;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        linear-gradient(90deg, var(--purple), #199ad6, var(--cyan)) border-box;
      color: var(--text);
      text-decoration: none;
      box-shadow: 0 18px 70px rgba(82, 192, 185, 0.18);
      transition: transform 180ms ease, background 180ms ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1)) padding-box,
        linear-gradient(90deg, var(--purple), #199ad6, var(--cyan)) border-box;
    }

    .ghost {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 640px) {
      .hero {
        padding: 96px 20px 56px;
      }

      .actions {
        width: 100%;
      }

      .cta {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-video {
        display: none;
      }

      .cta {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <video class="hero-video" autoplay loop muted playsinline preload="auto" poster="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.jpg">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
      </video>
      <div class="hero-overlay"></div>
      <div class="hero-gradient"></div>

      <div class="hero-content">
        <p class="eyebrow">Cowork</p>
        <h1 id="hero-title">Work alone, together.</h1>
        <p>
          Cowork brings focused people into shared spaces where
          <span class="accent">momentum, ideas, and opportunity</span>
          move through the room.
        </p>
        <div class="actions" aria-label="Cowork actions">
          <a class="cta" href="#">Book a tour</a>
          <a class="cta ghost" href="#">View memberships</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
